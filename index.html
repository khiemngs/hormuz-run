<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Hormuz Run</title>
  <meta name="description" content="Steer a container ship through the Strait of Hormuz while two navies fight around you." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="hud">
    <div id="tl" class="panel">
      <div class="lbl">MV Ever Dodging · Hull</div>
      <div class="bar"><i id="hullBar"></i></div>
      <div class="row"><span class="lbl">Cargo</span><b id="cargo">45/45</b></div>
      <div class="row"><span class="lbl">Speed</span><b id="speed">0 kn</b></div>
      <div id="status"></div>
    </div>

    <div id="prog" class="panel">
      <div class="lbl">Strait of Hormuz transit</div>
      <div id="track"><div id="shipdot"></div></div>
      <div class="names"><span>Persian Gulf</span><span>The Narrows</span><span>Gulf of Oman</span></div>
    </div>

    <div id="tr" class="panel">
      <div class="lbl" style="text-align:right">Score</div>
      <div class="big" id="score">0</div>
      <div class="row"><span class="lbl">To safety</span><b id="dist">40.0 nm</b></div>
      <div class="row kb"><span class="lbl">Flares</span><b id="flares">3</b></div>
      <div class="row kb"><span class="lbl">Horn</span><b id="horn">READY</b></div>
    </div>

    <div id="tech" class="panel">
      <div class="lbl">Tech · <kbd>`</kbd> toggle</div>
      <canvas id="fpsGraph" width="200" height="34"></canvas>
      <div id="techBody"></div>
    </div>

    <div id="touch">
      <div class="pad left">
        <button type="button" data-key="a" aria-label="Rudder left">◀</button>
        <button type="button" data-key="d" aria-label="Rudder right">▶</button>
      </div>
      <div class="pad right">
        <button type="button" id="tFlare" aria-label="Flares">🎆<small id="tFlareN">3</small></button>
        <button type="button" data-key="w" aria-label="Throttle up">▲</button>
        <button type="button" id="tHorn" aria-label="Horn">📯</button>
        <button type="button" data-key="s" aria-label="Throttle down">▼</button>
      </div>
    </div>

    <div id="banner"></div>
    <div id="lock">⚠ MISSILE LOCK ⚠</div>
    <div id="radio" class="panel"></div>
    <div id="help" class="panel">
      <kbd>W</kbd><kbd>S</kbd> throttle · <kbd>A</kbd><kbd>D</kbd> rudder<br>
      <kbd>Space</kbd> flares · <kbd>H</kbd> horn · <kbd>P</kbd> pause · <kbd>M</kbd> mute · <kbd>`</kbd> tech
    </div>
  </div>

  <div id="vignette"></div>
  <div id="screen"><div class="card" id="card"></div></div>
  <button id="pause" type="button" aria-label="Pause">⏸</button>
  <button id="mute" type="button" title="Toggle audio (M)" aria-label="Toggle audio">🔊</button>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
