<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hormuz Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --hud: #f4ead8; --red: #ff4b3a; --amber: #ffb13b; --panel: rgba(12, 16, 24, .55); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: Rajdhani, system-ui, sans-serif; color: var(--hud); }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel { position: absolute; background: var(--panel); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(4px); }
  #tl { top: 14px; left: 14px; width: 230px; }
  #tr { top: 14px; right: 14px; width: 210px; }
  .lbl { font-size: 12px; letter-spacing: .14em; opacity: .7; text-transform: uppercase; }
  .big { font-size: 30px; font-weight: 700; line-height: 1; text-align: right; }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 3px; font-size: 17px; }
  .bar { height: 12px; background: rgba(255,255,255,.12); border-radius: 6px; overflow: hidden; margin: 4px 0 8px; }
  .bar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff4b3a, #ffb13b 40%, #4be37a); transition: width .2s; }
  #status { margin-top: 6px; font-weight: 700; font-size: 15px; min-height: 18px; }
  #prog { top: 14px; left: 50%; transform: translateX(-50%); width: min(520px, 40vw); text-align: center; }
  #track { position: relative; height: 8px; background: linear-gradient(90deg, #3a6ea5, #c0463a 42%, #c0463a 68%, #3a6ea5); border-radius: 4px; margin: 8px 0 5px; }
  #shipdot { position: absolute; top: 50%; left: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff; }
  .names { display: flex; justify-content: space-between; font-size: 11px; opacity: .75; letter-spacing: .08em; text-transform: uppercase; }
  #banner { position: absolute; top: 26%; left: 0; right: 0; text-align: center; font-family: 'Black Ops One', sans-serif; font-size: clamp(30px, 6vw, 66px); text-shadow: 0 4px 18px rgba(0,0,0,.7); opacity: 0; transition: opacity .3s; }
  #banner small { display: block; font-family: Rajdhani, sans-serif; font-size: 20px; letter-spacing: .2em; opacity: .9; }
  #lock { position: absolute; top: 118px; left: 50%; transform: translateX(-50%); color: var(--red); font-family: 'Black Ops One', sans-serif; font-size: 28px; display: none; text-shadow: 0 0 12px var(--red); }
  #radio { bottom: 16px; left: 16px; max-width: min(480px, 70vw); font-size: 17px; opacity: 0; transition: opacity .3s; }
  #radio b { color: var(--amber); }
  #help { bottom: 16px; right: 16px; font-size: 14px; line-height: 1.55; text-align: right; opacity: .85; }
  kbd { display: inline-block; min-width: 22px; padding: 0 5px; border: 1px solid rgba(255,255,255,.35); border-bottom-width: 2px; border-radius: 4px; font: 700 12px Rajdhani, sans-serif; text-align: center; }
  #vignette { position: fixed; inset: 0; pointer-events: none; }
  .pop { position: absolute; font-weight: 700; font-size: 21px; white-space: nowrap; transform: translate(-50%, -50%); text-shadow: 0 2px 6px #000; }
  #screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(0,0,0,.3), rgba(0,0,0,.78)); }
  .card { max-width: 660px; padding: 28px 34px; text-align: center; }
  h1 { font-family: 'Black Ops One', sans-serif; font-size: clamp(38px, 8vw, 76px); margin: 0; color: var(--amber); text-shadow: 0 4px 0 #7a2a12; line-height: 1; }
  .tag { letter-spacing: .3em; text-transform: uppercase; opacity: .8; margin: 8px 0 18px; }
  .card p { font-size: 18px; line-height: 1.45; margin: 8px 0; }
  .grid { display: grid; grid-template-columns: auto 1fr; gap: 5px 16px; text-align: left; margin: 16px auto; max-width: 460px; font-size: 16px; }
  button { font: 700 20px Rajdhani, sans-serif; letter-spacing: .14em; padding: 12px 36px; border: 0; border-radius: 8px; background: var(--amber); color: #1a1208; cursor: pointer; margin-top: 14px; }
  button:hover { filter: brightness(1.1); }
  @media (max-width: 760px) { #prog, #help { display: none; } }
</style>
</head>
<body>
<div id="hud">
  <div id="tl" class="panel">
    <div class="lbl">MV Ever Dodging · Hull</div>
    <div class="bar"><i id="hullBar"></i></div>
    <div class="row"><span class="lbl">Cargo</span><b id="cargo">45/45</b></div>
    <div class="row"><span class="lbl">Speed</span><b id="speed">0 kn</b></div>
    <div id="status"></div>
  </div>
  <div id="prog" class="panel">
    <div class="lbl">Strait of Hormuz transit</div>
    <div id="track"><div id="shipdot"></div></div>
    <div class="names"><span>Persian Gulf</span><span>The Narrows</span><span>Gulf of Oman</span></div>
  </div>
  <div id="tr" class="panel">
    <div class="lbl" style="text-align:right">Score</div>
    <div class="big" id="score">0</div>
    <div class="row"><span class="lbl">To safety</span><b id="dist">40.0 nm</b></div>
    <div class="row"><span class="lbl">Flares</span><b id="flares">3</b></div>
    <div class="row"><span class="lbl">Horn</span><b id="horn">READY</b></div>
  </div>
  <div id="banner"></div>
  <div id="lock">⚠ MISSILE LOCK ⚠</div>
  <div id="radio" class="panel"></div>
  <div id="help" class="panel">
    <kbd>W</kbd><kbd>S</kbd> throttle · <kbd>A</kbd><kbd>D</kbd> rudder<br>
    <kbd>Space</kbd> flares · <kbd>H</kbd> horn · <kbd>P</kbd> pause
  </div>
</div>
<div id="vignette"></div>
<div id="screen"><div class="card" id="card"></div></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ============================================================
// Helpers
// ============================================================

const TRACK = 4000;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const $ = id => document.getElementById(id);

// Lane half-width narrows around the middle of the run (the Narrows).
const laneHalf = z => 50 - 22 * Math.exp(-(((-z / TRACK) - 0.55) ** 2) / 0.02);

// Must match the water vertex shader.
const waveH = (x, z, t) =>
  Math.sin(x * 0.08 + t * 1.2) * 0.6 + Math.sin(z * 0.06 + t * 0.9) * 0.8 +
  Math.sin((x + z) * 0.15 + t * 2.0) * 0.25 + Math.sin(x * 0.31 - z * 0.23 + t * 2.7) * 0.12;

const fbm = (x, z) => (Math.sin(x * 0.045 + 1.3) * Math.cos(z * 0.031) + 0.5 * Math.sin(x * 0.11 + z * 0.083 + 2.1) +
  0.25 * Math.sin(z * 0.19 - x * 0.15) + 0.125 * Math.sin(x * 0.37 + z * 0.29)) / 1.875 * 0.5 + 0.5;
const landH = (out, z, seed) => -2.5 + smooth(0, 28, out) * (5 + 28 * fbm(out * 1.3 + seed, z));

// ============================================================
// Renderer, scene, lights
// ============================================================

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

// Fog is mixed in after tone mapping, so it is defined in display space.
const FOG = new THREE.Color().setRGB(0.86, 0.66, 0.50, THREE.LinearSRGBColorSpace);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(FOG, 140, 720);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 1500);
const SUN = new THREE.Vector3(-0.45, 0.3, -0.84).normalize();

scene.add(new THREE.HemisphereLight(0xffe2c4, 0x3a4a5a, 1.2));
const sun = new THREE.DirectionalLight(0xffd2a0, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 10, far: 500 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

const boomLight = new THREE.PointLight(0xffa050, 0, 180, 1);
scene.add(boomLight);

// Dynamic objects live here so a restart can wipe them in one go.
const dyn = new THREE.Group();
scene.add(dyn);

// ============================================================
// Sky and water
// ============================================================

const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uTop: { value: new THREE.Color(0x35588c) }, uLow: { value: new THREE.Color(0xe0a070) }, uFog: { value: FOG }, uSun: { value: SUN } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform vec3 uTop; uniform vec3 uLow; uniform vec3 uFog; uniform vec3 uSun; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir); float h = clamp(d.y, 0.0, 1.0);
      vec3 col = mix(uLow, uTop, pow(h, 0.6));
      float s = max(dot(d, uSun), 0.0);
      col += vec3(1.0, 0.5, 0.2) * pow(s, 6.0) * 0.5 + vec3(1.0, 0.9, 0.7) * smoothstep(0.9975, 0.999, s) * 4.0;
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      gl_FragColor.rgb = mix(gl_FragColor.rgb, uFog, 1.0 - smoothstep(0.0, 0.22, d.y));
    }`,
}));
sky.frustumCulled = false;
sky.renderOrder = -1;
scene.add(sky);

const waterMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 }, uSun: { value: SUN }, uFog: { value: FOG }, uNear: { value: 140 }, uFar: { value: 720 },
    uDeep: { value: new THREE.Color(0x0b3346) }, uShallow: { value: new THREE.Color(0x2c7a86) },
  },
  vertexShader: `
    uniform float uTime; varying vec3 vW; varying float vH;
    void main(){
      vec4 w = modelMatrix * vec4(position, 1.0);
      float h = sin(w.x*0.08 + uTime*1.2)*0.6 + sin(w.z*0.06 + uTime*0.9)*0.8
              + sin((w.x + w.z)*0.15 + uTime*2.0)*0.25 + sin(w.x*0.31 - w.z*0.23 + uTime*2.7)*0.12;
      w.y += h; vH = h; vW = w.xyz;
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: `
    uniform vec3 uSun, uFog, uDeep, uShallow; uniform float uNear, uFar, uTime; varying vec3 vW; varying float vH;
    void main(){
      vec3 n = normalize(cross(dFdx(vW), dFdy(vW))); if (n.y < 0.0) n = -n;
      n = normalize(n + vec3(sin(vW.x*0.9 + uTime*3.0)*0.025, 0.0, cos(vW.z*0.8 - uTime*2.5)*0.025));
      vec3 v = normalize(cameraPosition - vW);
      float fres = pow(1.0 - max(dot(n, v), 0.0), 4.0);
      vec3 col = mix(uDeep, uShallow, clamp(vH*0.3 + 0.45, 0.0, 1.0));
      col *= 0.6 + 0.5*max(dot(n, uSun), 0.0);
      col = mix(col, vec3(0.62, 0.45, 0.34), fres*0.35);
      col += vec3(1.0, 0.8, 0.55) * pow(max(dot(n, normalize(uSun + v)), 0.0), 400.0) * 1.2;
      col += smoothstep(1.2, 1.7, vH) * vec3(0.25);
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      gl_FragColor.rgb = mix(gl_FragColor.rgb, uFog, smoothstep(uNear, uFar, length(cameraPosition - vW)));
    }`,
});
const water = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1300, 160, 210).rotateX(-Math.PI / 2), waterMat);
water.frustumCulled = false;
scene.add(water);

// ============================================================
// Coastlines, buoys, finish gate
// ============================================================

function buildLand(offset, seed, mirror) {
  const L = TRACK + 1400, W = 260;
  const geo = new THREE.PlaneGeometry(1, 1, 36, 280).rotateX(-Math.PI / 2);
  const p = geo.attributes.position, col = new Float32Array(p.count * 3), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i) + 0.5, v = p.getZ(i) + 0.5;
    const z = -(TRACK + 900) + v * L;
    const out = u * u * W;
    const h = landH(out, z, seed);
    p.setXYZ(i, laneHalf(z) + offset - 4 + out, h, z);
    c.setHex(h < 0.6 ? 0xdcc294 : h < 7 ? 0xc49a6c : h < 18 ? 0x9a7552 : 0xb49a80);
    c.offsetHSL(0, 0, (Math.random() - 0.5) * 0.04);
    col.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 }));
  m.receiveShadow = true;
  if (mirror) m.scale.x = -1;
  scene.add(m);
}
const IRAN_OFF = 10, IRAN_SEED = 0;
buildLand(IRAN_OFF, IRAN_SEED, true);   // Iranian coast, port side
buildLand(78, 50, false);               // Omani coast, far starboard

{
  const zs = [];
  for (let z = 0; z > -TRACK; z -= 40) zs.push(z);
  const buoys = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.5, 0.9, 2.6, 8),
    new THREE.MeshStandardMaterial({ color: 0xd8342a, emissive: 0x551008 }), zs.length * 2);
  const m = new THREE.Matrix4();
  zs.forEach((z, i) => {
    const hw = laneHalf(z);
    buoys.setMatrixAt(i * 2, m.makeTranslation(hw + 1, 0.6, z));
    buoys.setMatrixAt(i * 2 + 1, m.makeTranslation(-(hw + 1), 0.6, z));
  });
  scene.add(buoys);
}

function textSprite(text, w, h, font, color = '#fff', bg = null) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
  g.font = font; g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, w / 2, h / 2 + 4);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthWrite: false }));
}

{
  const hw = laneHalf(-TRACK);
  for (const s of [-1, 1]) {
    const tower = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 2, 22, 12), new THREE.MeshStandardMaterial({ color: 0xf4f4f4 }));
    tower.position.set(s * (hw - 2), 11, -TRACK);
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(1.6, 12, 8), new THREE.MeshBasicMaterial({ color: 0x55ff88 }));
    lamp.position.set(s * (hw - 2), 23, -TRACK);
    scene.add(tower, lamp);
  }
  const sign = textSprite('GULF OF OMAN · SAFE WATERS', 1024, 128, '700 64px Rajdhani, sans-serif', '#ffffff', 'rgba(20,90,50,0.85)');
  sign.scale.set(64, 8, 1);
  sign.position.set(0, 26, -TRACK);
  scene.add(sign);
}

// ============================================================
// Particles
// ============================================================

class Particles {
  constructor(max, additive) {
    this.max = max; this.i = 0;
    this.pos = new Float32Array(max * 3); this.col = new Float32Array(max * 3);
    this.size = new Float32Array(max); this.alpha = new Float32Array(max);
    this.vel = new Float32Array(max * 3); this.life = new Float32Array(max); this.maxLife = new Float32Array(max);
    this.grow = new Float32Array(max); this.grav = new Float32Array(max); this.drag = new Float32Array(max); this.a0 = new Float32Array(max);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    g.setAttribute('aColor', new THREE.BufferAttribute(this.col, 3));
    g.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1));
    g.setAttribute('aAlpha', new THREE.BufferAttribute(this.alpha, 1));
    this.geo = g;
    this.mat = new THREE.ShaderMaterial({
      uniforms: { uScale: { value: 600 } },
      vertexShader: `
        attribute vec3 aColor; attribute float aSize; attribute float aAlpha; uniform float uScale;
        varying vec3 vC; varying float vA;
        void main(){ vC = aColor; vA = aAlpha; vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * uScale / max(-mv.z, 0.1); gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `
        varying vec3 vC; varying float vA;
        void main(){ float d = length(gl_PointCoord - 0.5); if (d > 0.5) discard;
          gl_FragColor = vec4(vC, vA * smoothstep(0.5, 0.1, d)); }`,
      transparent: true, depthWrite: false,
      blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    });
    this.points = new THREE.Points(g, this.mat);
    this.points.frustumCulled = false;
    scene.add(this.points);
  }
  spawn(x, y, z, vx, vy, vz, r, g, b, size, life, grow = 0, grav = 0, drag = 0, alpha = 1) {
    const i = this.i; this.i = (i + 1) % this.max;
    const i3 = i * 3;
    this.pos[i3] = x; this.pos[i3 + 1] = y; this.pos[i3 + 2] = z;
    this.vel[i3] = vx; this.vel[i3 + 1] = vy; this.vel[i3 + 2] = vz;
    this.col[i3] = r; this.col[i3 + 1] = g; this.col[i3 + 2] = b;
    this.size[i] = size; this.life[i] = life; this.maxLife[i] = life;
    this.grow[i] = grow; this.grav[i] = grav; this.drag[i] = drag; this.a0[i] = alpha; this.alpha[i] = 0;
  }
  update(dt) {
    for (let i = 0; i < this.max; i++) {
      if (this.life[i] <= 0) continue;
      this.life[i] -= dt;
      if (this.life[i] <= 0) { this.alpha[i] = 0; this.size[i] = 0; continue; }
      const i3 = i * 3, dr = Math.max(0, 1 - this.drag[i] * dt);
      this.vel[i3] *= dr; this.vel[i3 + 1] = this.vel[i3 + 1] * dr - this.grav[i] * dt; this.vel[i3 + 2] *= dr;
      this.pos[i3] += this.vel[i3] * dt; this.pos[i3 + 1] += this.vel[i3 + 1] * dt; this.pos[i3 + 2] += this.vel[i3 + 2] * dt;
      this.size[i] += this.grow[i] * dt;
      const k = this.life[i] / this.maxLife[i];
      this.alpha[i] = this.a0[i] * Math.min(1, k * 1.5) * Math.min(1, (1 - k) * 8 + 0.2);
    }
    for (const a of ['position', 'aColor', 'aSize', 'aAlpha']) this.geo.attributes[a].needsUpdate = true;
  }
  clear() { this.life.fill(0); this.alpha.fill(0); this.size.fill(0); }
}
const fx = new Particles(4000, true);     // fire, flashes, flares
const smoke = new Particles(7000, false); // smoke, spray, wake

// ============================================================
// Audio (all synthesized)
// ============================================================

let AC = null, master, noiseBuf, engGain;
function initAudio() {
  if (AC) { AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const osc = AC.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = 38;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 110;
  engGain = AC.createGain(); engGain.gain.value = 0;
  osc.connect(lp).connect(engGain).connect(master); osc.start();
}
function noise(dur, type, f0, f1, vol, q = 1) {
  if (!AC) return;
  const t = AC.currentTime, src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = noiseBuf; f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f).connect(g).connect(master); src.start(t, Math.random()); src.stop(t + dur + 0.05);
}
function tone(freq, dur, type = 'square', vol = 0.12, slide = freq) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
}
const distVol = p => clamp(1 - Math.hypot(p.x - ship.x, p.z - ship.z) / 500, 0.06, 1);
const sfxBoom = (p, s = 1) => noise(1.3 * s, 'lowpass', 1400, 50, 0.9 * distVol(p) * s);
const sfxLaunch = p => noise(0.7, 'bandpass', 300, 2400, 0.35 * distVol(p), 2);
const sfxPickup = () => [660, 880, 1320].forEach((f, i) => setTimeout(() => tone(f, 0.15, 'triangle', 0.15), i * 70));
function sfxHorn() {
  if (!AC) return;
  const t = AC.currentTime;
  for (const f of [73.4, 110, 146.8]) {
    const o = AC.createOscillator(), lp = AC.createBiquadFilter(), g = AC.createGain();

function hullDist(x, z) {
  const dx = x - ship.x, dz = z - ship.z, c = Math.cos(ship.yaw), s = Math.sin(ship.yaw);
  const lx = dx * c - dz * s, lz = dx * s + dz * c;
  return Math.hypot(Math.max(Math.abs(lx) - 4.5, 0), Math.max(Math.abs(lz) - 21.5, 0));
}
function toWorld(lx, lz) {
  const c = Math.cos(ship.yaw), s = Math.sin(ship.yaw);
  return { x: ship.x + lx * c + lz * s, z: ship.z - lx * s + lz * c };
}

function damage(amount, what) {
  if (state !== 'play') return;
  if (ship.shield > 0) {
    popup('BLOCKED', shipCenter().setY(16), '#6fc3ff');

  ship.hp -= amount;
  stats.hits++;
  shake = Math.max(shake, 0.6 + amount * 0.05);
  flashVignette('rgba(255,30,0,0.55)', amount / 20);
  loseContainers(Math.max(1, Math.round(amount / 7)));
  if (what) popup(what, shipCenter().setY(18), '#ff6b5a');

    state = 'sinking';
    sinkT = 0;

function shooters() {
  const list = [];
  for (const d of destroyers) if (Math.abs(d.z - ship.z) < 320) list.push({ pos: gunPos(d), side: 1 });
  for (const b of batteries) if (b.pos.z < ship.z + 80 && b.pos.z > ship.z - 340) list.push({ pos: b.pos.clone(), side: -1 });
  return list;
}

function fireShell(forceAim = false) {
  const list = shooters();
  if (!list.length) return;
  const sh = pick(list);
  const dur = rand(1.8, 2.5);
  const fwd = ship.speed * dur;
  const aimed = forceAim || Math.random() < 0.6;
  const px = ship.x - Math.sin(ship.yaw) * fwd, pz = ship.z - Math.cos(ship.yaw) * fwd;
  const to = new THREE.Vector3(
    px + (aimed ? rand(-9, 9) : rand(-30, 30)), 0.5,
    pz + (aimed ? rand(-14, 14) : rand(-40, 40)));
  const hw = laneHalf(to.z);
  to.x = clamp(to.x, -hw - 4, hw + 4);

  const marker = new THREE.Group();
  const fill = new THREE.Mesh(DISC_MARK, FILL_MAT);
  marker.add(new THREE.Mesh(RING_MARK, MARK_MAT), fill);
  marker.position.set(to.x, 2, to.z);
  dyn.add(marker);
  const mesh = new THREE.Mesh(SHELL_GEO, SHELL_MAT);
  dyn.add(mesh);
  shells.push({ from: sh.pos.clone(), to, t: 0, dur, marker, fill, mesh, arc: 18 + sh.pos.distanceTo(to) * 0.25 });
  muzzle(sh.pos, -sh.side);
  sfxBoom(sh.pos, 0.35);
}

function nearest(list, z, getZ) {
  let best = null, bd = Infinity;
  for (const o of list) { const d = Math.abs(getZ(o) - z); if (d < bd) { bd = d; best = o; } }
  return best;
}

// Missiles that fly across the strait between the two sides.
function launchCross(warned) {
  const delay = warned ? 2.4 : 0.3;
  const zc = warned
    ? ship.z - ship.speed * (delay + 0.6) - rand(-10, 70)
    : ship.z - rand(260, 560);
  const d = nearest(destroyers, zc, o => o.z), b = nearest(batteries, zc, o => o.pos.z);
  if (!d || !b) return;
  const usPos = gunPos(d).setY(6), irPos = b.pos.clone().setY(b.pos.y + 1);
  usPos.z = zc + rand(-25, 25);
  const fromUS = Math.random() < 0.5;
  const from = fromUS ? usPos : irPos, to = fromUS ? irPos : usPos;
  const len = from.distanceTo(to);

  let warn = null;
  if (warned) {
    warn = new THREE.Mesh(WARN_GEO, new THREE.MeshBasicMaterial({ map: chevronTex, transparent: true, opacity: 0.8, depthWrite: false }));
    warn.scale.set(len, 1, 3.2);
    warn.position.set((from.x + to.x) / 2, 2.1, (from.z + to.z) / 2);
    warn.rotation.y = Math.atan2(-(to.z - from.z), to.x - from.x);
    dyn.add(warn);
  }
  const mesh = buildMissile();
  mesh.visible = false;
  dyn.add(mesh);
  crosses.push({ from, to, t: 0, delay, dur: len / 115, mesh, warn, warned, minD: Infinity, fromUS });
}

function launchHoming() {
  const zc = ship.z - rand(90, 200);
  const fromUS = Math.random() < 0.45;
  const pos = fromUS ? gunPos(nearest(destroyers, zc, o => o.z)).setY(6) : nearest(batteries, zc, o => o.pos.z).pos.clone();
  const mesh = buildMissile();
  mesh.scale.setScalar(1.3);
  dyn.add(mesh);
  const toShip = shipCenter().sub(pos).normalize();
  homings.push({
    pos, dir: toShip.add(new THREE.Vector3(0, 0.8, 0)).normalize(), speed: 46, life: 9, target: null, mesh,
    interceptAt: Math.random() < 0.25 ? rand(1.5, 3) : -1, fromUS, age: 0,
  });
  muzzle(pos, fromUS ? -1 : 1);
  sfxLaunch(pos);
  radio(...(fromUS ? ['USS Resolute', 'Uh... that one might have locked onto the wrong ship. Sorry!'] : ['IRGC Command', 'Target the big container ship!']));
}

function spawnBoats(n) {
  for (let i = 0; i < n && boats.length < 5; i++) {
    const z = ship.z - rand(60, 220), hw = laneHalf(z);
    const g = buildBoat();
    dyn.add(g);
    boats.push({
      g, pos: new THREE.Vector3(-(hw + 2), 0, z), yaw: -Math.PI / 2, speed: 10, state: 'approach',
      fireCd: rand(2, 3), lx: (Math.random() < 0.75 ? -1 : 1) * rand(14, 24), lz: rand(-18, 18), life: 35,
    });
  }
  radio('IRGC Fast Boats', 'Intercept the container ship! Swarm it!');
}

function deployFlares() {
  if (ship.flares <= 0 || ship.flareCd > 0) return;
  ship.flares--;
  ship.flareCd = 0.8;
  for (let i = 0; i < 5; i++) {
    const w = toWorld(rand(-4, 4), 20);
    const a = (i / 4 - 0.5) * 2.4;
    const c = Math.cos(ship.yaw), s = Math.sin(ship.yaw);
    const lvx = Math.sin(a) * 14, lvz = 8;
    flares.push({ pos: new THREE.Vector3(w.x, 12, w.z), vel: new THREE.Vector3(lvx * c + lvz * s, rand(10, 16), -lvx * s + lvz * c), life: 3.5 });
  }
  let fooled = 0;
  for (const h of homings) if (!h.target && Math.random() < 0.85) { h.target = pick(flares); fooled++; }
  if (fooled) addScore(75 * fooled, 'DECOYED', shipCenter().setY(20), '#ffb13b');
  tone(1400, 0.25, 'sawtooth', 0.08, 300);
  noise(0.4, 'highpass', 2000, 800, 0.3);
}

function horn() {
  if (ship.hornCd > 0) return;
  ship.hornCd = 7;
  sfxHorn();
  banner('HOOOONK', '', 1, '#ffb13b');
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.9, 1, 64).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xfff0c0, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending }));
  ring.position.set(ship.x, 2.5, ship.z);
  dyn.add(ring);
  waves.push({ m: ring, t: 0 });
  for (const b of boats) {
    if (b.state === 'approach' && b.pos.distanceTo(shipCenter().setY(0)) < 65) {
      b.state = 'flee';
      addScore(25, 'SCARED OFF', b.pos.clone().setY(5), '#fff0c0');
    }
  }
}

// ============================================================
// Setup / reset
// ============================================================

function populateTrack() {
  for (let z = -260; z > -TRACK + 80; z -= rand(30, 70) / (0.5 + Math.exp(-(((-z / TRACK) - 0.55) ** 2) / 0.04))) {
    const hw = laneHalf(z);
    const g = buildMine();
    const pos = new THREE.Vector3(rand(-hw + 6, hw - 6), 0, z);
    g.position.copy(pos);
    dyn.add(g);
    mines.push({ g, pos, phase: Math.random() * 6 });
  }
  const total = PICKUP_WEIGHTS.reduce((a, [, w]) => a + w, 0);
  for (let z = -140; z > -TRACK + 60; z -= rand(95, 145)) {
    let r = Math.random() * total, type = 'gold';
    for (const [k, w] of PICKUP_WEIGHTS) { if ((r -= w) < 0) { type = k; break; } }
    const hw = laneHalf(z);
    const g = buildPickup(type);
    const pos = new THREE.Vector3(rand(-hw + 10, hw - 10), 0, z);
    g.position.copy(pos);
    dyn.add(g);
    pickups.push({ g, pos, type, phase: Math.random() * 6 });
  }
}

function reset() {
  dyn.clear();
  for (const p of pops) p.el.remove();
  shells = []; crosses = []; homings = []; boats = []; bullets = []; flares = []; mines = []; pickups = []; flying = []; waves = []; pops = [];
  fx.clear(); smoke.clear();
  Object.assign(ship, {
    x: 0, z: 40, yaw: 0, speed: 12, target: 12, rudder: 0, roll: 0, hp: 100, flares: 3, flareCd: 0,
    hornCd: 0, shield: 0, turbo: 0, groundCd: 0, zoneCd: 0, closeCd: 0, dist: 0,
  });
  Object.assign(dir, { shell: 3, cross: 5, ambient: 1, homing: 20, boat: 10, event: 28, evt: null, evtT: 0 });
  stats = { hits: 0, closeCalls: 0, rammed: 0, needles: 0 };
  score = 0; playTime = 0; shake = 0; sinkT = 0;
  buildCargo();
  shipGroup.position.set(0, 0, ship.z);
  shipGroup.rotation.set(0, 0, 0);
  for (const d of destroyers) d.z = ship.z - d.offset;
  populateTrack();
  radioQueue.length = 0;
}

// ============================================================
// Update
// ============================================================

function intensity() {
  const p = clamp(-ship.z / TRACK, 0, 1);
  let k = 0.35 + 0.85 * Math.min(1, p / 0.55) - 0.25 * Math.max(0, (p - 0.8) / 0.2);
  if (dir.evt === 'ceasefire') k = 0;
  if (dir.evt === 'escalation') k *= 1.8;
  if (playTime < 7) k = 0;
  return k;
}

function director(dt) {
  const p = clamp(-ship.z / TRACK, 0, 1);

  if (dir.evt) { dir.evtT -= dt; if (dir.evtT <= 0) dir.evt = null; }
  dir.event -= dt;
  if (dir.event <= 0 && p < 0.95) {
    dir.event = rand(22, 32);
    const r = Math.random();
    if (r < 0.35) {
      dir.evt = 'ceasefire'; dir.evtT = 6;
      banner('CEASEFIRE', 'six seconds of peace. probably.', 2.5, '#9fe0ff');
      radio('UN Observer', 'Both sides have agreed to a brief ceasefire. Move it!');
    } else if (r < 0.75) {
      dir.evt = 'escalation'; dir.evtT = 8;
      banner('ESCALATION!', 'everyone is shooting everything', 2.5, '#ff4b3a');
      radioRandom();
    }
  }

  const k = intensity();
  dir.ambient -= dt;
  if (dir.ambient <= 0 && dir.evt !== 'ceasefire' && playTime > 2) { dir.ambient = rand(1, 2.5); launchCross(false); }
  if (k <= 0) return;

  dir.shell -= dt * k;
  if (dir.shell <= 0) { dir.shell = rand(1.6, 3); fireShell(); if (Math.random() < k * 0.35) fireShell(); }
  dir.cross -= dt * k;
  if (dir.cross <= 0) { dir.cross = rand(3.5, 6); launchCross(true); }
  if (p > 0.15) { dir.homing -= dt * k; if (dir.homing <= 0) { dir.homing = rand(10, 16); launchHoming(); } }
  if (p > 0.07) { dir.boat -= dt * k; if (dir.boat <= 0) { dir.boat = rand(9, 15); spawnBoats(1 + (Math.random() < p ? 1 : 0)); } }
  if (Math.random() < dt * 0.04) radioRandom();
}

function updateShip(dt) {
  const s = ship;
  let r = 0;
  if (state === 'play') {
    if (keys.w) s.target = Math.min(22, s.target + 10 * dt);
    if (keys.s) s.target = Math.max(2, s.target - 12 * dt);
    r = (keys.a ? 1 : 0) - (keys.d ? 1 : 0);
  }
  s.rudder += (r - s.rudder) * Math.min(1, dt * 1.8);
  const top = state === 'sinking' ? 0 : s.target + (s.turbo > 0 ? 16 : 0);
  s.speed += clamp(top - s.speed, -6 * dt, 3 * dt * (s.turbo > 0 ? 4 : 1));
  s.yaw += s.rudder * 0.34 * (0.35 + s.speed / 22) * dt;
  if (Math.abs(r) < 0.1) s.yaw -= s.yaw * 0.25 * dt;
  s.yaw = clamp(s.yaw, -0.7, 0.7);
  s.x += -Math.sin(s.yaw) * s.speed * dt;
  s.z += -Math.cos(s.yaw) * s.speed * dt;

  const hw = laneHalf(s.z);
  if (s.x < -(hw - 5)) {
    s.x = -(hw - 5);
    s.yaw = -Math.abs(s.yaw) * 0.5;
    if (s.groundCd <= 0) {
      s.groundCd = 1.2; s.speed *= 0.6;
      damage(8, 'RAN AGROUND');
      radio('Chief Engineer', 'We\'re scraping the Iranian coast! That\'s not a parking spot!');
    }
  }
  if (s.x > hw - 4) {
    s.x = hw - 4;
    s.yaw = Math.abs(s.yaw) * 0.5;
    if (s.zoneCd <= 0 && state === 'play') {
      s.zoneCd = 5;
      radio('USS Vigilant', 'Merchant vessel, you are entering the exclusion zone. Warning shots!');
      fireShell(true); fireShell(true);
    }
  }

  for (const k of ['groundCd', 'zoneCd', 'closeCd', 'hornCd', 'flareCd', 'turbo', 'shield']) s[k] = Math.max(0, s[k] - dt);
  s.roll += (-s.rudder * 0.06 * (s.speed / 22) - s.roll) * dt * 2;
  s.dist = Math.max(s.dist, -s.z);

  let y = waveH(s.x, s.z, time) * 0.3, roll = s.roll + Math.sin(time * 0.7) * 0.015, pitch = Math.sin(time * 0.55) * 0.01;
  if (state === 'sinking') {
    sinkT += dt;
    y -= sinkT * sinkT * 0.5;
    roll += sinkT * 0.12;
    pitch -= sinkT * 0.04;
  }
  shipGroup.position.set(s.x, y, s.z);
  shipGroup.rotation.set(pitch, s.yaw, roll);

  shieldMesh.visible = s.shield > 0;
  if (shieldMesh.visible) shieldMesh.material.opacity = 0.14 + Math.sin(time * 10) * 0.06 * (s.shield < 1.5 ? 2 : 1);

  // Wake and bow spray.
  const n = Math.round(s.speed / 7) + (s.turbo > 0 ? 3 : 0);
  for (let i = 0; i < n; i++) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const st = toWorld(side * rand(1, 4), 21), bw = toWorld(side * rand(1.5, 3), -20);
    const c = Math.cos(s.yaw), sn = Math.sin(s.yaw), out = side * rand(2, 5);
    smoke.spawn(st.x, 0.8, st.z, out * c, 0, -out * sn, 0.92, 0.96, 1, rand(1.2, 2.2), rand(2.5, 4), 1.6, 0, 1.2, 0.35);
    if (Math.random() < 0.5) smoke.spawn(bw.x, 1, bw.z, out * c * 1.5, rand(1, 4), -out * sn * 1.5, 0.95, 0.98, 1, rand(0.8, 1.6), 1.2, 1.2, 6, 1, 0.5);
  }
  if (s.turbo > 0) {
    const st = toWorld(rand(-3, 3), 22);
    fx.spawn(st.x, 1.5, st.z, 0, 1, 0, 1, 0.3, 0.9, 3, 0.4, 3);
  }
  // Smoke and fire as the hull takes damage.
  if (s.hp < 70 && Math.random() < (70 - s.hp) / 40) {
    const p = toWorld(rand(-3.5, 3.5), rand(-15, 15));
    const g = rand(0.1, 0.2);
    smoke.spawn(p.x, 8, p.z, rand(-1, 1), rand(4, 7), rand(-1, 1), g, g, g, 3, 3, 3, -0.5, 0.2, 0.8);
    if (s.hp < 40) fx.spawn(p.x, 7, p.z, 0, rand(2, 5), 0, 1, 0.45, 0.1, rand(2, 3.5), 0.5, 1);
  }

  if (state === 'sinking' && sinkT > 4.5) showEnd(false);
  if (state === 'play' && s.z <= -TRACK) win();
}

function updateThreats(dt) {
  // Artillery shells
  for (let i = shells.length - 1; i >= 0; i--) {
    const s = shells[i];
    s.t += dt;
    const k = Math.min(1, s.t / s.dur);
    s.mesh.position.lerpVectors(s.from, s.to, k);
    s.mesh.position.y += s.arc * 4 * k * (1 - k);
    s.fill.scale.setScalar(Math.max(0.01, k));
    s.marker.position.y = 2 + waveH(s.to.x, s.to.z, time) * 0.3;
    if (Math.random() < 0.7) trail(s.mesh.position, 0.8);
    if (k >= 1) {
      explode(s.to, 1);
      const d = hullDist(s.to.x, s.to.z);
      if (d < 5.5) damage(14, 'SHELL HIT');
      else if (d < 15 && state === 'play' && ship.closeCd <= 0) {
        ship.closeCd = 1; stats.closeCalls++;
        addScore(50, 'CLOSE CALL', s.to.clone().setY(8));
      }
      dyn.remove(s.marker, s.mesh);
      shells.splice(i, 1);
    }
  }

  // Cross-strait missiles
  for (let i = crosses.length - 1; i >= 0; i--) {
    const c = crosses[i];
    c.t += dt;
    if (c.t < c.delay) {
      if (c.warn) {
        const u = c.t / c.delay;
        c.warn.material.opacity = 0.35 + 0.5 * Math.abs(Math.sin(c.t * (4 + u * 14)));
      }
      continue;
    }
    if (!c.mesh.visible) { c.mesh.visible = true; muzzle(c.from, c.fromUS ? -1 : 1); sfxLaunch(c.from); }
    const k = (c.t - c.delay) / c.dur;
    const p = new THREE.Vector3().lerpVectors(c.from, c.to, Math.min(1, k));
    p.y += Math.sin(Math.PI * Math.min(1, k)) * 5;
    c.mesh.position.copy(p);
    const ahead = new THREE.Vector3().lerpVectors(c.from, c.to, Math.min(1, k + 0.02));
    ahead.y += Math.sin(Math.PI * Math.min(1, k + 0.02)) * 5;
    c.mesh.lookAt(ahead);
    trail(p); trail(p);
    const d = hullDist(p.x, p.z);
    c.minD = Math.min(c.minD, d);
    let done = false;
    if (d < 1.8 && state === 'play') {
      explode(p, 1.3, false);
      damage(22, 'DIRECT HIT');
      done = true;
    } else if (k >= 1) {
      explode(c.to, 1.2, false);
      if (c.warned && c.minD < 16 && state === 'play') { stats.needles++; addScore(100, 'THREADED THE NEEDLE', shipCenter().setY(22), '#9fe0ff'); }
      done = true;
    }
    if (done) {
      if (c.warn) dyn.remove(c.warn);
      dyn.remove(c.mesh);
      crosses.splice(i, 1);
    } else if (c.warn) c.warn.material.opacity = Math.max(0, c.warn.material.opacity - dt * 1.5);
  }

  // Homing missiles
  let locked = false;
  for (let i = homings.length - 1; i >= 0; i--) {
    const h = homings[i];
    h.life -= dt; h.age += dt;
    const tgt = h.target ? h.target.pos : shipCenter();
    if (!h.target) locked = true;
    const want = tgt.clone().sub(h.pos).normalize();
    h.dir.lerp(want, Math.min(1, (h.age < 0.8 ? 0.6 : 1.9) * dt)).normalize();
    h.pos.addScaledVector(h.dir, h.speed * dt);
    h.pos.y = Math.max(h.pos.y, 2);
    h.mesh.position.copy(h.pos);
    h.mesh.lookAt(h.pos.clone().add(h.dir));
    trail(h.pos, 1.3); trail(h.pos, 1.3);
    let done = false;
    if (h.interceptAt > 0 && h.age > h.interceptAt) {
      explode(h.pos, 0.8, false);
      radio(...(h.fromUS ? ['IRGC Battery', 'We shot down the Americans\' missile! ...you\'re welcome, ship.'] : ['USS Mercer', 'Splash one! You owe us a coffee, merchant.']));
      addScore(50, 'INTERCEPTED', h.pos, '#9fe0ff');
      done = true;
    } else if (!h.target && hullDist(h.pos.x, h.pos.z) < 1.5 && h.pos.y < 16) {
      explode(h.pos, 1.5, false);
      damage(25, 'MISSILE HIT');
      done = true;
    } else if (h.target && h.pos.distanceTo(h.target.pos) < 3) {
      explode(h.pos, 0.9, false);
      done = true;
    } else if (h.life <= 0) {
      explode(h.pos, 0.7, h.pos.y < 3);
      done = true;
    }
    if (done) { dyn.remove(h.mesh); homings.splice(i, 1); }
  }
  $('lock').style.display = locked && state === 'play' && Math.sin(time * 14) > -0.3 ? 'block' : 'none';
  if (locked && state === 'play') {
    updateThreats.beep = (updateThreats.beep || 0) - dt;
    if (updateThreats.beep <= 0) { updateThreats.beep = 0.35; tone(1250, 0.08, 'square', 0.07); }
  }

  // Flares
  for (let i = flares.length - 1; i >= 0; i--) {
    const f = flares[i];
    f.life -= dt;
    f.vel.y -= 5 * dt;
    f.vel.multiplyScalar(1 - dt * 0.6);
    f.pos.addScaledVector(f.vel, dt);
    fx.spawn(f.pos.x, f.pos.y, f.pos.z, rand(-1, 1), rand(-1, 1), rand(-1, 1), 1, 0.85, 0.5, rand(2, 3.5), 0.3, -3);
    smoke.spawn(f.pos.x, f.pos.y, f.pos.z, 0, 0.5, 0, 0.85, 0.85, 0.85, 1.2, 1.4, 2, 0, 0.5, 0.4);
    if (f.life <= 0) {
      for (const h of homings) if (h.target === f) h.target = { pos: f.pos.clone() };
      flares.splice(i, 1);
    }
  }

  // Fast boats
  for (let i = boats.length - 1; i >= 0; i--) {
    const b = boats[i];
    b.life -= dt;
    if (b.life <= 0 || state !== 'play') b.state = 'flee';
    const hw = laneHalf(b.pos.z);
    let tx, tz, spd;
    if (b.state === 'approach') {
      const w = toWorld(b.lx, b.lz);
      tx = w.x; tz = w.z;
      spd = clamp(Math.hypot(tx - b.pos.x, tz - b.pos.z) * 1.5, ship.speed, ship.speed + 18);
    } else {
      tx = -(hw + 40); tz = b.pos.z - 30; spd = 34;
    }
    const want = Math.atan2(-(tx - b.pos.x), -(tz - b.pos.z));
    let dy = want - b.yaw;
    dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    b.yaw += clamp(dy, -2.6 * dt, 2.6 * dt);
    b.speed += (spd - b.speed) * Math.min(1, dt * 2);
    b.pos.x += -Math.sin(b.yaw) * b.speed * dt;
    b.pos.z += -Math.cos(b.yaw) * b.speed * dt;
    b.g.position.set(b.pos.x, waveH(b.pos.x, b.pos.z, time) * 0.6 + 0.2, b.pos.z);
    b.g.rotation.set(-0.08, b.yaw, Math.sin(time * 3 + i) * 0.08);
    if (Math.random() < 0.8) {
      const bx = b.pos.x + Math.sin(b.yaw) * 3, bz = b.pos.z + Math.cos(b.yaw) * 3;
      smoke.spawn(bx, 0.7, bz, rand(-1, 1), 0, rand(-1, 1), 0.93, 0.97, 1, 1.4, 1.6, 2, 0, 1, 0.8);
    }

    const d = hullDist(b.pos.x, b.pos.z);
    if (d < 0.8 && state === 'play') {
      explode(b.pos, 0.8);
      stats.rammed++;
      addScore(150, 'RAMMED!', b.pos.clone().setY(6), '#ff9f43');
      dyn.remove(b.g); boats.splice(i, 1);
      continue;
    }
    if (b.state === 'approach' && d < 30) {
      b.fireCd -= dt;
      if (b.fireCd <= 0) {
        b.fireCd = rand(1.1, 1.9);
        const from = b.pos.clone().setY(1.6);
        const w = toWorld(rand(-3.5, 3.5), rand(-16, 16));
        const to = new THREE.Vector3(w.x + rand(-1.5, 1.5), rand(3, 8), w.z + rand(-1.5, 1.5));
        for (let n = 0; n < 3; n++) {
          const m = new THREE.Mesh(BULLET_GEO, BULLET_MAT);
          const v = to.clone().sub(from).normalize().multiplyScalar(120);
          v.x += rand(-4, 4); v.y += rand(-2, 2);
          const start = from.clone().addScaledVector(v, -n * 0.012);
          m.position.copy(start);
          m.lookAt(start.clone().add(v));
          dyn.add(m);
          bullets.push({ m, v, life: 0.8 });
        }
        muzzle(from, 0);
        noise(0.15, 'highpass', 3000, 1200, 0.2 * distVol(from));
      }
    }
    if ((b.state === 'flee' && (b.pos.x < -(hw + 30) || Math.abs(b.pos.z - ship.z) > 300)) || b.pos.z > ship.z + 200) {
      dyn.remove(b.g); boats.splice(i, 1);
    }
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    b.m.position.addScaledVector(b.v, dt);
    const p = b.m.position;
    if (p.y < 13 && hullDist(p.x, p.z) < 0.3) {
      for (let n = 0; n < 5; n++) fx.spawn(p.x, p.y, p.z, rand(-6, 6), rand(0, 6), rand(-6, 6), 1, 0.9, 0.5, 0.8, 0.2);
      damage(1.5);
      b.life = 0;
    }
    if (b.life <= 0) { dyn.remove(b.m); bullets.splice(i, 1); }
  }

  // Mines
  MINE_LIGHT.color.setHex(Math.sin(time * 6) > 0 ? 0xff2200 : 0x330000);
  for (let i = mines.length - 1; i >= 0; i--) {
    const m = mines[i];
    const near = Math.abs(m.pos.z - ship.z) < 800;
    m.g.visible = near;
    if (!near) continue;
    m.pos.x += Math.sin(time * 0.3 + m.phase) * 0.6 * dt;
    m.g.position.set(m.pos.x, waveH(m.pos.x, m.pos.z, time) * 0.8 - 0.1, m.pos.z);
    m.g.rotation.set(Math.sin(time + m.phase) * 0.2, time * 0.2 + m.phase, 0);
    if (state === 'play' && hullDist(m.pos.x, m.pos.z) < 1.3) {
      explode(m.pos, 1.4);
      damage(20, 'MINE!');
      dyn.remove(m.g); mines.splice(i, 1);
    }
  }

  // Pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    const near = Math.abs(p.pos.z - ship.z) < 800;
    p.g.visible = near;
    if (!near) continue;
    p.g.position.set(p.pos.x, waveH(p.pos.x, p.pos.z, time) * 0.7 + 1 + Math.sin(time * 2 + p.phase) * 0.4, p.pos.z);
    p.g.rotation.y = time * 1.5 + p.phase;
    if (state === 'play' && hullDist(p.pos.x, p.pos.z) < 2.5) {
      collect(p.type, p.pos.clone().setY(10));
      dyn.remove(p.g); pickups.splice(i, 1);
    }
  }
}

function collect(type, pos) {
  const P = PICKUPS[type];
  sfxPickup();
  popup(P.label, pos, P.css);
  flashVignette(P.css + '88', 0.5);
  if (type === 'repair') ship.hp = Math.min(100, ship.hp + 30);
  if (type === 'flare') ship.flares += 2;
  if (type === 'shield') { ship.shield = 7; radio('Captain', 'Raise the neutral flag! Nobody shoots a ship this polite.'); }
  if (type === 'turbo') { ship.turbo = 5; radio('Chief Engineer', 'Overriding the governor! She\'s gonna blow... fast!'); }
  if (type === 'gold') score += 300;
}

function updateWorld(dt) {
  // Destroyers keep pace with the player along the starboard side.
  destroyers.forEach((d, i) => {
    const target = ship.z - d.offset - Math.sin(time * 0.1 + i) * 30;
    d.z += clamp(target - d.z, -28 * dt, 28 * dt);
    const hw = laneHalf(d.z);
    d.group.position.set(hw + 30 + d.xoff, waveH(hw + 30, d.z, time) * 0.3, d.z);
    d.group.rotation.z = Math.sin(time * 0.8 + i) * 0.02;
    if (Math.random() < 0.3) smoke.spawn(d.group.position.x, 0.7, d.z + 14, rand(-1, 1), 0, 2, 0.93, 0.97, 1, 2, 2.5, 2, 0, 1, 0.7);
  });

  for (let i = flying.length - 1; i >= 0; i--) {
    const f = flying[i];
    f.t += dt;
    const m = f.m;
    if (!f.floating) {
      f.v.y -= 22 * dt;
      m.position.addScaledVector(f.v, dt);
      m.rotation.x += f.av.x * dt; m.rotation.y += f.av.y * dt; m.rotation.z += f.av.z * dt;
      if (m.position.y < 0.5) {
        f.floating = true;
        for (let n = 0; n < 14; n++) smoke.spawn(m.position.x, 0.5, m.position.z, rand(-4, 4), rand(6, 14), rand(-4, 4), 0.92, 0.96, 1, 2, 1.2, 1, 22, 0.3);
      }
    } else {
      m.position.y += (waveH(m.position.x, m.position.z, time) * 0.6 - 0.5 - m.position.y) * Math.min(1, dt * 3);
      m.rotation.x *= 1 - dt; m.rotation.z *= 1 - dt;
    }
    if (f.t > 16) { dyn.remove(m); flying.splice(i, 1); }
  }

  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.t += dt;
    w.m.position.set(ship.x, 2.5, ship.z);
    w.m.scale.setScalar(6 + w.t * 80);
    w.m.material.opacity = Math.max(0, 0.8 - w.t);
    if (w.t > 0.8) { dyn.remove(w.m); waves.splice(i, 1); }
  }
}

function updateCamera(dt) {
  const s = ship;
  const target = new THREE.Vector3(s.x, 4, s.z);
  let desired;
  if (state === 'menu') {
    const a = time * 0.12;
    desired = new THREE.Vector3(s.x + Math.sin(a) * 75, 30, s.z + Math.cos(a) * 75);
  } else {
    const a = s.yaw * 0.6, back = 56 + s.speed * 0.6;
    desired = new THREE.Vector3(s.x + Math.sin(a) * back, 36 + s.speed * 0.3, s.z + Math.cos(a) * back);
    target.x -= Math.sin(s.yaw) * 30;
    target.z -= Math.cos(s.yaw) * 30;
  }
  camera.position.lerp(desired, 1 - Math.exp(-3 * dt));
  shake = Math.max(0, shake - dt * 2.5);
  const sh = shake * shake;
  camera.position.x += rand(-1, 1) * sh; camera.position.y += rand(-1, 1) * sh;
  camera.lookAt(target);
  const fov = 60 + (s.turbo > 0 ? 12 : 0);
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov += (fov - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix(); updatePointScale(); }

  sky.position.copy(camera.position);
  water.position.set(Math.round(s.x / 10) * 10, 0, Math.round(s.z / 10) * 10 - 300);
  sun.position.set(s.x + SUN.x * 220, SUN.y * 220, s.z + SUN.z * 220 - 20);
  sun.target.position.set(s.x, 0, s.z - 20);
  boomLight.intensity *= Math.exp(-7 * dt);
}

function updateHUD(dt) {
  const s = ship;
  $('hullBar').style.width = `${s.hp}%`;
  $('cargo').textContent = `${cargo.length}/${CARGO_MAX}`;
  $('speed').textContent = `${(s.speed * 1.1).toFixed(0)} kn`;
  $('score').textContent = Math.floor(score + s.dist).toLocaleString();
  $('dist').textContent = `${Math.max(0, (TRACK + s.z) / 100).toFixed(1)} nm`;
  $('flares').textContent = s.flares;
  $('horn').textContent = s.hornCd > 0 ? `${s.hornCd.toFixed(1)}s` : 'READY';
  const st = [];
  if (s.shield > 0) st.push(`<span style="color:#6fc3ff">🛡️ SHIELD ${s.shield.toFixed(1)}</span>`);
  if (s.turbo > 0) st.push(`<span style="color:#ff7ae0">⚡ TURBO ${s.turbo.toFixed(1)}</span>`);
  if (dir.evt === 'ceasefire') st.push('<span style="color:#9fe0ff">CEASEFIRE</span>');
  if (dir.evt === 'escalation') st.push('<span style="color:#ff4b3a">ESCALATION</span>');
  $('status').innerHTML = st.join(' · ');
  $('shipdot').style.left = `${clamp(-s.z / TRACK, 0, 1) * 100}%`;

  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').style.opacity = 0; }
  radioT -= dt;
  if (radioT <= 0) {
    if (radioQueue.length) {
      const [who, text] = radioQueue.shift();
      $('radio').innerHTML = `📻 <b>${who}:</b> ${text}`;
      $('radio').style.opacity = 1;
      radioT = 3.8;
      tone(2200, 0.05, 'square', 0.03);
    } else $('radio').style.opacity = 0;
  }

  const W = innerWidth, H = innerHeight, v = new THREE.Vector3();
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i];
    p.t += dt;
    v.copy(p.pos); v.y += p.t * 8; v.project(camera);
    p.el.style.left = `${(v.x * 0.5 + 0.5) * W}px`;
    p.el.style.top = `${(-v.y * 0.5 + 0.5) * H}px`;
    p.el.style.opacity = 1 - p.t / 1.5;
    if (p.t > 1.5 || v.z > 1) { p.el.remove(); pops.splice(i, 1); }
  }

  if (engGain) engGain.gain.setTargetAtTime(state === 'play' ? 0.05 + s.speed * 0.006 : 0.02, AC.currentTime, 0.2);
}

// ============================================================
// Screens
// ============================================================

function best() { try { return +localStorage.getItem('hormuz-best') || 0; } catch { return 0; } }
function saveBest(v) { try { if (v > best()) localStorage.setItem('hormuz-best', v); } catch {} }

function showMenu() {
  $('screen').style.display = 'flex';
  $('card').innerHTML = `
    <h1>HORMUZ RUN</h1>
    <div class="tag">one container ship · two navies · zero chill</div>
    <p>You captain the <b>MV Ever Dodging</b>, a very large, very slow container ship.
       The US Navy and Iran are fighting over the Strait of Hormuz, and you are right in the middle.
       Get your cargo to the Gulf of Oman.</p>
    <div class="grid">
      <kbd>W / S</kbd><span>Throttle. She's heavy, so plan ahead.</span>
      <kbd>A / D</kbd><span>Rudder. Turning takes a while too.</span>
      <kbd>Space</kbd><span>Launch flares to decoy homing missiles</span>
      <kbd>H</kbd><span>Ship horn scares off IRGC fast boats</span>
      <span>🔴 Red circles</span><span>Incoming artillery. Don't be there when it lands.</span>
      <span>➤ Red lanes</span><span>A missile is about to cross the strait. Slow down or speed through.</span>
      <span>💥 Fast boats</span><span>Ram them with your 200,000 tons for bonus points</span>
      <span>🔧⚡🛡️🎆💰</span><span>Repair, turbo, neutral-flag shield, flares, bonus cargo</span>
    </div>
    ${best() ? `<p style="opacity:.7">Best score: ${best().toLocaleString()}</p>` : ''}
    <button id="go">SET SAIL</button>`;
  $('go').onclick = start;
}

function start() {
  initAudio();
  reset();
  state = 'play';
  $('screen').style.display = 'none';
  banner('ENTERING THE STRAIT', 'Persian Gulf → Gulf of Oman', 3);
  radio('Captain', 'Entering the Strait of Hormuz. Both navies are... busy today.');
  radio('Ship Owner', 'Deliver the cargo. ALL of it. Please.');
}

function win() {
  state = 'win';
  banner('SAFE WATERS!', 'cargo delivered', 3, '#4be37a');
  radio('Ship Owner', 'You actually made it?! Drinks are on me. Well, on insurance.');
  for (let i = 0; i < 12; i++) setTimeout(() => {
    const p = new THREE.Vector3(ship.x + rand(-40, 40), rand(30, 60), ship.z - rand(20, 90));
    const col = [rand(0.4, 1), rand(0.4, 1), rand(0.4, 1)];
    for (let n = 0; n < 60; n++) {
      const a = Math.random() * 6.28, e = rand(-1.5, 1.5), v = rand(8, 18);
      fx.spawn(p.x, p.y, p.z, Math.cos(a) * Math.cos(e) * v, Math.sin(e) * v, Math.sin(a) * Math.cos(e) * v, ...col, 1.6, 1.6, 0, 6, 1);
    }
    tone(rand(300, 600), 0.4, 'triangle', 0.1, 80);
  }, i * 300);
  setTimeout(() => showEnd(true), 3500);
}

function showEnd(won) {
  if (state === 'dead' || state === 'over') return;
  const cargoBonus = won ? cargo.length * 100 : 0, hullBonus = won ? Math.round(ship.hp) * 20 : 0;
  const total = Math.floor(score + ship.dist) + cargoBonus + hullBonus;
  saveBest(total);
  state = won ? 'over' : 'dead';
  $('screen').style.display = 'flex';
  $('card').innerHTML = `
    <h1 style="color:${won ? '#4be37a' : '#ff4b3a'}">${won ? 'DELIVERED!' : 'SUNK'}</h1>
    <div class="tag">${won ? 'the insurance company weeps with joy' : `went down ${((TRACK - ship.dist) / 100).toFixed(1)} nm from safety`}</div>
    <div class="grid">
      <span>Distance</span><b>${(ship.dist / 100).toFixed(1)} / 40 nm</b>
      <span>Containers saved</span><b>${cargo.length} / ${CARGO_MAX}${won ? ` (+${cargoBonus})` : ''}</b>
      ${won ? `<span>Hull bonus</span><b>+${hullBonus}</b>` : ''}
      <span>Close calls</span><b>${stats.closeCalls}</b>
      <span>Needles threaded</span><b>${stats.needles}</b>
      <span>Fast boats rammed</span><b>${stats.rammed}</b>
      <span>Hits taken</span><b>${stats.hits}</b>
      <span style="font-size:22px">Final score</span><b style="font-size:22px;color:var(--amber)">${total.toLocaleString()}</b>
      <span>Best</span><b>${best().toLocaleString()}</b>
    </div>
    <button id="go">${won ? 'SAIL AGAIN' : 'TRY AGAIN'}</button>`;
  $('go').onclick = start;
}

// ============================================================
// Input, resize, loop
// ============================================================

const KEYMAP = { arrowup: 'w', arrowdown: 's', arrowleft: 'a', arrowright: 'd' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.key.toLowerCase()] || e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ' || k.startsWith('arrow')) e.preventDefault();
  if (state === 'play') {
    if (k === ' ') deployFlares();
    if (k === 'h') horn();
    if (k === 'p' || k === 'escape') { paused = !paused; banner(paused ? 'PAUSED' : '', '', paused ? 1e9 : 0.01); }
  } else if (k === 'enter' && $('screen').style.display !== 'none') start();
});
addEventListener('keyup', e => { keys[KEYMAP[e.key.toLowerCase()] || e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function updatePointScale() {
  const h = renderer.getDrawingBufferSize(new THREE.Vector2()).y;
  const s = h / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  fx.mat.uniforms.uScale.value = s;
  smoke.mat.uniforms.uScale.value = s;
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  updatePointScale();
});
updatePointScale();

reset();
showMenu();

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (paused) dt = 0;
  time += dt;
  if (state === 'play') { playTime += dt; director(dt); }
  waterMat.uniforms.uTime.value = time;
  updateShip(dt);
  updateThreats(dt);
  updateWorld(dt);
  fx.update(dt);
  smoke.update(dt);
  updateCamera(dt);
  updateHUD(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
</script>
